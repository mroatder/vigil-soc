name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build web interface
        working-directory: web
        run: |
          npm ci
          npx vite build

      - name: Run tests
        run: |
          python test_alert_console.py
          node web/tests/facts.test.mjs
          node web/tests/i18n.test.mjs

      - name: Build Vigil.exe
        shell: cmd
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --onefile --noconsole --name Vigil --icon installer\vigil.ico --add-data "web\dist;web\dist" --add-data "mask_terms.example.txt;." --add-data "environment.example.txt;." alert_console.py

      - name: Start Vigil.exe and check the home page
        shell: pwsh
        env:
          VIGIL_NO_BROWSER: "1"
          VIGIL_DATA_DIR: ${{ runner.temp }}\vigil-smoke
        run: |
          $lanIp = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -match '^(10|192\.168|172\.(1[6-9]|2[0-9]|3[01]))\.' } | Select-Object -First 1).IPAddress
          if ($lanIp) { $env:VIGIL_LAN_IP = $lanIp }
          $process = Start-Process dist\Vigil.exe -PassThru
          Start-Sleep -Seconds 8
          $page = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing
          if ($lanIp) {
            $own = Invoke-WebRequest "http://${lanIp}:8765/" -UseBasicParsing
            if ($own.Content -notmatch 'name="app-token"') { throw 'Vigil did not open on the network address' }
          }
          if ($page.Content -notmatch 'name="app-can-quit" content="true"') { throw 'Vigil did not start without a console' }
          $second = Start-Process dist\Vigil.exe -PassThru
          if (-not $second.WaitForExit(15000)) { throw 'A second start did not hand over to the running app' }
          $token = [regex]::Match($page.Content, 'name="app-token" content="([^"]+)"').Groups[1].Value
          Invoke-WebRequest http://127.0.0.1:8765/api/quit -Method Post -UseBasicParsing -ContentType 'application/json' -Headers @{ 'X-App-Token' = $token } -Body '{"confirm":true}' | Out-Null
          if (-not $process.WaitForExit(15000)) { throw 'Vigil did not quit' }

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path alert_console.py -Pattern 'APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\vigil.iss

      - uses: actions/upload-artifact@v4
        with:
          name: vigil-windows
          path: dist/VigilSetup-*.exe

      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $setup = (Get-ChildItem dist\VigilSetup-*.exe).FullName
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup --clobber
          } else {
            gh release create $tag $setup --title "Vigil $env:VERSION" --notes "Windows installer for Vigil $env:VERSION. The installer is not code signed, so Windows SmartScreen may show a warning."
          }
          exit 0
